    <script>
      (function() {
        var initialPreloader = document.getElementById("preloader");
        if (initialPreloader) {
          window.__inputlabPreloaderHTML = initialPreloader.outerHTML;
        }

        var STAGES = [
          { threshold: 0, label: "INITIALIZING HID BUS" },
          { threshold: 24, label: "POLLING HIGH-SPEED USB" },
          { threshold: 52, label: "SAMPLING MATRIX & ENCODER" },
          { threshold: 76, label: "VERIFYING SUB-MS TIMING" },
          { threshold: 96, label: "DIAGNOSTIC ENGINE READY" }
        ];

        function runPreloaderEngine(targetEl) {
          if (!targetEl) return;
          document.documentElement.classList.add("preloader-active");
          document.body.classList.add("preloader-active");
          var percent = targetEl.querySelector("#preloader-percent");
          var fill = targetEl.querySelector("#preloader-fill");
          var stage = targetEl.querySelector("#preloader-stage");
          var isDone = false;
          var startTime = Date.now();
          var minDuration = 2400; // Guaranteed at least 2.4s of smooth continuous motion

          function updateStageText(pct) {
            if (!stage) return;
            var currentLabel = STAGES[0].label;
            for (var i = 0; i < STAGES.length; i++) {
              if (pct >= STAGES[i].threshold) {
                currentLabel = STAGES[i].label;
              }
            }
            if (stage.textContent !== currentLabel) {
              stage.textContent = currentLabel;
            }
          }

          function complete() {
            if (isDone) return;
            isDone = true;
            clearInterval(timer);
            if (percent) percent.textContent = "100%";
            if (fill) fill.style.width = "100%";
            updateStageText(100);

            setTimeout(function() {
              targetEl.classList.add("hide");
              document.documentElement.classList.remove("preloader-active");
              document.body.classList.remove("preloader-active");
              setTimeout(function() {
                try {
                  if (targetEl.parentNode) {
                    targetEl.parentNode.removeChild(targetEl);
                  }
                } catch(e) {}
              }, 800);
            }, 300);
          }

          var timer = setInterval(function() {
            var elapsed = Date.now() - startTime;
            var ratio = Math.min(elapsed / minDuration, 1);
            // Smooth progress interpolation
            var currentPercent = Math.min(100, Math.floor(ratio * 100));

            if (percent) percent.textContent = currentPercent + "%";
            if (fill) fill.style.width = currentPercent + "%";
            updateStageText(currentPercent);

            if (elapsed >= minDuration) {
              clearInterval(timer);
              setTimeout(complete, 250);
            }
          }, 25);

          // Allow manual dismissal only AFTER the full choreographed showcase has completed
          function onUserDismiss() {
            if (Date.now() - startTime >= minDuration) {
              complete();
              window.removeEventListener("keydown", onUserDismiss);
            }
          }
          targetEl.addEventListener("click", onUserDismiss);
          window.addEventListener("keydown", onUserDismiss);

          // Safety failsafe
          setTimeout(complete, 4800);
        }

        if (initialPreloader) {
          runPreloaderEngine(initialPreloader);
        }

        // Global function to replay preloader on demand
        window.replayInputLabPreloader = function() {
          var existing = document.getElementById("preloader");
          if (existing) {
            try { existing.parentNode.removeChild(existing); } catch(e) {}
          }
          if (window.__inputlabPreloaderHTML) {
            var wrapper = document.createElement("div");
            wrapper.innerHTML = window.__inputlabPreloaderHTML;
            var newEl = wrapper.firstElementChild;
            newEl.classList.remove("hide");
            document.body.appendChild(newEl);
            runPreloaderEngine(newEl);
          }
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
