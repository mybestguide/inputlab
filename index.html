    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://inputlab.ai.studio/#website",
            "url": "https://inputlab.ai.studio/",
            "name": "InputLab",
            "description": "Free browser-based keyboard tester and mouse tester to check keys, buttons, clicks, double-click chatter, movement, and scrolling online."
          },
          {
            "@type": "WebApplication",
            "@id": "https://inputlab.ai.studio/#webapp",
            "name": "InputLab Device Diagnostics",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "All modern web browsers (Chrome, Firefox, Edge, Safari)",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('inputlab_settings_v1');
          var theme = raw ? JSON.parse(raw).theme : 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
